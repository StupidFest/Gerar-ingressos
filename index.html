<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ingressos • Gerador e Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="logo" class="logo">
      <div>
        <h1>Show de Teste 2025</h1>
        <small>Painel de Ingressos</small>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="tabs">
      <button class="tab active" data-tab="generate">Gerar Ingresso</button>
      <button class="tab" data-tab="scanner">Scanner</button>
    </nav>

    <section id="generate" class="tabcontent active">
      <div class="card">
        <h2>Gerar Ingresso</h2>
        <form id="formGenerate">
          <label>Nome completo</label>
          <input id="name" placeholder="Nome do comprador" required>

          <div class="row">
            <div class="col">
              <label>Valor (R$)</label>
              <input id="value" type="number" step="0.01" placeholder="50.00" required>
            </div>
            <div class="col">
              <label>Tipo</label>
              <select id="type">
                <option>Normal</option>
                <option>Promocional</option>
                <option>VIP</option>
              </select>
            </div>
          </div>

          <label>Comprovante (opcional)</label>
          <input id="receipt" type="file" accept="image/*">

          <div class="actions">
            <button id="generateBtn" type="button">Gerar Ingresso</button>
          </div>

          <div id="generateMsg" class="message"></div>
        </form>
      </div>
    </section>

    <section id="scanner" class="tabcontent">
      <div class="card">
        <h2>Scanner de Ingressos</h2>
        <p>Aponte a câmera para o QR Code do ingresso.</p>
        <div class="video-wrap">
          <video id="video" playsinline></video>
          <canvas id="canvas" style="display:none"></canvas>
        </div>
        <div id="scanResult" class="scan-result"></div>
        <div class="actions">
          <button id="restartScan" style="display:none">Escanear novamente</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <small>Feito com ♥ • Show de Teste 2025</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="script.js"></script>
</body>
</html>
