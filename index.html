<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Ingressos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .big-confirm { font-size: 2rem; color: green; font-weight: 700; margin-top: 10px; }
  #reader { width: 100%; margin-top: 10px; }
</style>
</head>
<body class="p-4">

<h2>Gerador de Ingressos</h2>
<div class="mb-3">
  <button id="openGenerate" class="btn btn-primary">Gerar Ingresso</button>
  <button id="openScanner" class="btn btn-success">Scanner Ingresso</button>
</div>

<!-- Modal Gerar Ingresso -->
<div class="modal" tabindex="-1" id="modalGenerate">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Gerar Ingresso</h5></div>
      <div class="modal-body">
        <form id="formTicket">
          <div class="mb-2">
            <label>Nome</label>
            <input class="form-control" name="name" required>
          </div>
          <div class="mb-2">
            <label>Valor</label>
            <input class="form-control" name="value" required>
          </div>
          <div class="mb-2">
            <label>Tipo</label>
            <select class="form-select" name="type" required>
              <option value="PROMOCIONAL">PROMOCIONAL</option>
              <option value="NORMAL" selected>NORMAL</option>
              <option value="VIP">VIP</option>
            </select>
          </div>
          <div class="mb-2">
            <label>Comprovante (opcional)</label>
            <input type="file" class="form-control" id="comprovante" accept="image/*,application/pdf">
          </div>
          <div id="generateStatus" class="mt-2"></div>
          <div class="text-end mt-3">
            <button type="submit" class="btn btn-primary">Gerar</button>
            <button type="button" class="btn btn-secondary" id="closeGenerate">Fechar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal Scanner -->
<div class="modal" tabindex="-1" id="modalScanner">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Scanner Ingresso</h5></div>
      <div class="modal-body">
        <div id="reader"></div>
        <div id="scanResult" class="mt-3"></div>
        <div class="text-end mt-2">
          <button class="btn btn-secondary" id="closeScanner">Fechar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyBFcsu3YIpJUFkeIVF5dN9DgF2G6eyyUD2JtQUAeUQcOM1179sRb8GZVHQrv-n9ydDg/exec';

const modalGenerate = new bootstrap.Modal(document.getElementById('modalGenerate'));
const modalScanner = new bootstrap.Modal(document.getElementById('modalScanner'));

document.getElementById('openGenerate').addEventListener('click', ()=> modalGenerate.show());
document.getElementById('closeGenerate').addEventListener('click', ()=> modalGenerate.hide());
document.getElementById('openScanner').addEventListener('click', ()=> {
  modalScanner.show();
  startScanner();
});
document.getElementById('closeScanner').addEventListener('click', ()=>{
  stopScanner();
  modalScanner.hide();
});

document.getElementById('formTicket').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const f = ev.target;
  const nome = f.name.value.trim();
  const valor = f.value.value.trim();
  const tipo = f.type.value;

  let comprovanteBase64 = "";
  const fileInput = document.getElementById('comprovante');
  if(fileInput.files.length){
    const file = fileInput.files[0];
    comprovanteBase64 = await toBase64(file);
  }

  document.getElementById('generateStatus').innerText = "Gerando ingresso...";

  // Gera PDF com QR Code sincronizado
  const codigo = gerarCodigo();
  const pdfBase64 = await gerarPdf(nome, valor, tipo, codigo);

  // Chama Apps Script via fetch
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      token: 'Ingressos2025#A1',
      action: 'generate',
      name: nome,
      value: valor,
      type: tipo,
      comprovante: comprovanteBase64,
      pdfBase64: pdfBase64,
      codigo: codigo // envia o mesmo código do QR
    })
  }).then(r=>r.json()).then(json=>{
    if(json.ok){
      document.getElementById('generateStatus').innerHTML = `Ingresso gerado! Código: <strong>${codigo}</strong><br><a href="${json.pdfUrl}" target="_blank">Baixar PDF</a>`;
    } else {
      document.getElementById('generateStatus').innerText = 'Erro: ' + json.error;
    }
  }).catch(err=>{
    document.getElementById('generateStatus').innerText = 'Erro na requisição: ' + err;
  });
});

function toBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function gerarCodigo(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<8;i++) code += chars.charAt(Math.floor(Math.random()*chars.length));
  return code;
}

async function gerarPdf(nome, valor, tipo, codigo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16);
  doc.text("Ingresso", 20, 20);
  doc.text(`Nome: ${nome}`, 20, 40);
  doc.text(`Valor: ${valor}`, 20, 60);
  doc.text(`Tipo: ${tipo}`, 20, 80);

  // QR Code com código sincronizado
  const qrDiv = document.createElement('div');
  new QRCode(qrDiv, { text: codigo, width: 80, height: 80 });
  await new Promise(r => setTimeout(r, 500));
  const img = qrDiv.querySelector('img');
  if(img) doc.addImage(img, 'PNG', 150, 20, 50, 50);

  return doc.output('datauristring');
}

// ---------------- SCANNER ----------------
let html5QrcodeScanner;
function startScanner(){
  const resultDiv = document.getElementById('scanResult');
  resultDiv.innerHTML = 'Aguardando leitura...';
  const qrRegionId = "reader";
  html5QrcodeScanner = new Html5Qrcode(qrRegionId);
  const config = { fps: 10, qrbox: 250 };
  html5QrcodeScanner.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    (err)=>{}
  );
}

function stopScanner(){
  if(html5QrcodeScanner){
    html5QrcodeScanner.stop().then(()=> html5QrcodeScanner.clear()).catch(()=>{});
    html5QrcodeScanner = null;
  }
}

function onScanSuccess(decodedText){
  stopScanner();
  const resultDiv = document.getElementById('scanResult');
  resultDiv.innerHTML = 'Lendo código: ' + decodedText;

  fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ token:'Ingressos2025#A1', action:'validate', codigo:decodedText, validator:'Douglas' })
  }).then(r=>r.json()).then(json=>{
    if(json.ok){
      if(json.status==='USADO'){
        resultDiv.innerHTML = `<div class="text-danger">Ingresso já utilizado</div>`;
      } else {
        resultDiv.innerHTML = `<div><strong>Nome:</strong> ${json.nome}</div>
                               <div><strong>Valor:</strong> ${json.valor}</div>
                               <div><strong>Tipo:</strong> ${json.tipo}</div>
                               <div class="big-confirm">INGRESSO CONFIRMADO</div>`;
      }
    } else {
      resultDiv.innerHTML = `<div class="text-danger">Erro: ${json.message || json.error}</div>`;
    }
  }).catch(err=>{
    resultDiv.innerHTML = 'Erro na verificação: ' + err;
  });
}
</script>

</body>
</html>
